  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              // Safely handle updates without throwing unhandled promise rejections
              if (typeof reg.update === 'function') {
                reg.update().catch(() => {
                  // Silent catch: network or sandbox iframe constraints
                });
              }

              // Detecta quando um novo Service Worker está pronto
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => {
              // Graceful fallback if Service Workers are restricted in sandbox environment
              console.warn('[SW] Registration skipped or restricted:', err?.message || err);
            });

          // Quando o novo Service Worker assumir o controle, recarrega para aplicar os estilos novos
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
