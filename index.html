<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Admin-Vapp</title>
    <meta name="description" content="Painel administrativo master do ecossistema VagouApp." />
    <meta name="application-name" content="Admin-Vapp" />

    <meta name="theme-color" content="#10B981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Admin-Vapp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <meta property="og:title" content="Admin-Vapp" />
    <meta property="og:description" content="Painel administrativo master do ecossistema VagouApp." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />

    <script>
      window.__vagouDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__vagouDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('vagou-pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__vagouDeferredInstallPrompt = null;
      });
      if (window.location.search.includes('bg=transparent') || window.location.search.includes('embed=true')) {
        document.documentElement.style.backgroundColor = 'transparent';
        window.addEventListener('DOMContentLoaded', () => {
          document.body.classList.remove('bg-slate-950');
          document.body.style.backgroundColor = 'transparent';
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              const checkUpdate = () => {
                if (typeof reg.update === 'function') {
                  reg.update().catch(() => {});
                }
              };
              checkUpdate();
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  checkUpdate();
                }
              });

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.warn('[SW] Registration skipped or restricted:', err?.message || err);
            });

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
